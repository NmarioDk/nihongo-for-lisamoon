<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/style.css">

<body>
  <!-- Tokyo Lofi Night 2D Background (100% Vector SVG & CSS, zero external assets) -->
  <div class="tokyo-bg" aria-hidden="true">
    <svg class="tokyo-sky-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Night Sky Gradient -->
        <linearGradient id="nightSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#090b14" />
          <stop offset="35%" stop-color="#11152a" />
          <stop offset="70%" stop-color="#1b1636" />
          <stop offset="100%" stop-color="#281745" />
        </linearGradient>

        <!-- Moon Soft Glow Filter -->
        <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.8" />
          <stop offset="50%" stop-color="#fef08a" stop-opacity="0.25" />
          <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
        </radialGradient>

        <!-- Tokyo Tower Glow -->
        <radialGradient id="towerGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ff6b35" stop-opacity="0.9" />
          <stop offset="60%" stop-color="#f97316" stop-opacity="0.2" />
          <stop offset="100%" stop-color="#f97316" stop-opacity="0" />
        </radialGradient>
      </defs>

      <!-- Background Sky -->
      <rect width="1440" height="900" fill="url(#nightSkyGrad)" />

      <!-- Moon and Halo -->
      <circle cx="1260" cy="130" r="70" fill="url(#moonGlow)" />
      <!-- Stylized Crescent Moon -->
      <path d="M 1260 90 A 40 40 0 1 0 1295 160 A 34 34 0 1 1 1260 90 Z" fill="#fef9c3" opacity="0.92" />

      <!-- Twinkling Stars (Groups with different pulse delays) -->

        <circle cx="140" cy="90" r="1.5" />
        <circle cx="280" cy="180" r="1.2" />
        <circle cx="420" cy="70" r="2.0" />
        <circle cx="610" cy="120" r="1.4" />
        <circle cx="780" cy="85" r="1.8" />
        <circle cx="950" cy="190" r="1.2" />
        <circle cx="1120" cy="110" r="2.2" />
        <circle cx="1340" cy="220" r="1.5" />
        <circle cx="80" cy="240" r="1.2" />
        <circle cx="510" cy="260" r="1.6" />

      <g class="star-group star-group-2" fill="#fed7aa">
        <circle cx="210" cy="130" r="1.8" />

        <circle cx="530" cy="160" r="2.0" />

        <circle cx="180" cy="300" r="1.2" />
        <circle cx="900" cy="270" r="1.5" />
      </g>

      <g class="star-group star-group-3" fill="#fbcfe8">

        <path d="M 830 65 Q 830 73 822 73 Q 830 73 830 81 Q 830 73 838 73 Q 830 73 830 65 Z" />
        <path d="M 1080 145 Q 1080 152 1073 152 Q 1080 152 1080 159 Q 1080 152 1087 152 Q 1080 152 1080 145 Z" />
      </g>

      <!-- Distant Tokyo Skyline Silhouette (Layer 1) -->
      <path d="M 0 900 L 0 740 L 40 740 L 40 760 L 90 760 L 90 710 L 150 710 L 150 770 L 220 770 L 220 690 L 270 690 L 270 780 L 330 780 L 330 730 L 400 730 L 400 790 L 510 790 L 510 700 L 580 700 L 580 770 L 670 770 L 670 740 L 730 740 L 730 800 L 820 800 L 820 710 L 890 710 L 890 760 L 980 760 L 980 730 L 1050 730 L 1050 770 L 1140 770 L 1140 690 L 1210 690 L 1210 750 L 1320 750 L 1320 720 L 1390 720 L 1390 770 L 1440 770 L 1440 900 Z" fill="#120e29" opacity="0.85" />

      <!-- Tokyo Tower (Prominent silhouette with warm orange glow) -->
      <g class="tokyo-tower-svg" transform="translate(1010, 540)">
        <circle cx="45" cy="160" r="110" fill="url(#towerGlow)" opacity="0.65" />
        <line x1="45" y1="0" x2="45" y2="40" stroke="#ffffff" stroke-width="2" />

        <rect x="32" y="165" width="26" height="5" fill="#ea580c" />

        <path d="M 28 320 Q 45 260 62 320 Z" fill="#090b14" />
        <line x1="32" y1="210" x2="58" y2="210" stroke="#ffffff" stroke-width="2" />
        <line x1="26" y1="245" x2="64" y2="245" stroke="#ffffff" stroke-width="2.5" />
        <line x1="20" y1="280" x2="70" y2="280" stroke="#ffffff" stroke-width="2.5" />

      <rect x="1390" y="785" width="4" height="6" fill="#fde047" opacity="0.9" />
      <rect x="1410" y="800" width="4" height="6" fill="#fef08a" opacity="0.85" />
    </svg>
  </div>

  <!-- Main Application Container -->
  <div id="app">
